# Single source of truth for every tunable setting. DVC tracks the sections each stage uses,
# so changing a value here makes `dvc repro` rerun only the affected stages.

data:
  raw_path: data/raw/creditcard.csv
  processed_dir: data/processed

split:              # chronological split — NEVER random for time-ordered fraud data
  train_frac: 0.70
  val_frac: 0.15    # test gets the remaining 0.15

train:
  model: xgboost          # xgboost | logreg
  run_baseline: true      # also log a logistic-regression baseline run for comparison
  tune: false             # true = Optuna search on the VALIDATION set (nested MLflow runs)
  n_trials: 20
  random_state: 42
  xgboost:
    n_estimators: 400
    max_depth: 5
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 1
    early_stopping_rounds: 40
  logreg:
    C: 0.1
    max_iter: 2000

mlflow:
  experiment_name: fraud-detection
  registered_model_name: fraud-detector

promote:
  metric: pr_auc
  min_improvement: 0.005
  champion_alias: champion
  challenger_alias: challenger

monitor:
  log_dir: data/logs
  features: [V1, V2, V3, V4, V5, V6, V7, V8, V9, V10, V11, V12, V13, V14, V15, V16, V17,
             V18, V19, V20, V21, V22, V23, V24, V25, V26, V27, V28, Amount]
  p_value_threshold: 0.01
  drift_share_threshold: 0.30
  min_samples: 100
  evidently_reference_sample: 20000
