# CI  = every push / PR: lint + unit tests + a pipeline smoke run on synthetic data.
# CD  = pushes to main only: build the API image and push it to GHCR tagged with the commit SHA.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Unit tests (pytest)
        run: pytest -q

  pipeline-smoke:
    # Runs the real pipeline code end to end on a small SYNTHETIC dataset with a throwaway
    # SQLite MLflow store — catches broken stages that unit tests miss. Metrics are meaningless.
    runs-on: ubuntu-latest
    needs: lint-test
    env:
      MLFLOW_TRACKING_URI: sqlite:///mlflow-ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Generate synthetic data
        run: python scripts/make_sample_data.py --rows 20000 --fraud-rate 0.01
      - name: validate -> split -> train -> promote
        run: |
          python -m src.validate
          python -m src.split
          python -m src.train --no-baseline
          python -m src.promote

  build-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint-test, pipeline-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # allows GITHUB_TOKEN to push to ghcr.io — no personal secrets needed
    steps:
      - uses: actions/checkout@v4
      - name: Image name (GHCR requires lowercase)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/fraud-api" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.sha }}
            ${{ steps.img.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
